{% comment %}
  Component: branding/components/color_token_row.html
  Args:
    label    — display name
    key      — field name
    value    — hex string
    is_glow  — True for rgba values
{% endcomment %}
<div class="flex items-center gap-4 group">
  <div class="w-10 h-10 rounded-xl flex-shrink-0 shadow-sm border border-base-700/50 transition-transform group-hover:scale-105" 
       style="background:{{ value|default:'transparent' }};"></div>
  
  <div class="min-w-0 flex-1">
    <p class="text-xs font-bold text-content-primary truncate uppercase tracking-tight" style="font-family:'Syne',sans-serif">{{ label }}</p>
    <p class="text-[10px] font-mono mt-0.5 text-content-muted/80 tracking-wider">{{ value|default:"—" }}</p>
  </div>

  <button onclick="navigator.clipboard.writeText('{{ value }}'); showToast('Copied {{ label }} value')"
          class="p-2 rounded-xl transition-all text-content-muted hover:text-accent hover:bg-accent/10 active:scale-90"
          title="Copy to clipboard">
    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
  </button>
</div>
