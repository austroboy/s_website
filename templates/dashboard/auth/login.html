<!DOCTYPE html>
<html>
<head>
  <title>Login | {{ request.tenant.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Include Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-950">

  <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-lg border border-gray-800">

    <!-- Administration Icon -->
    <div class="flex justify-center mb-4">
      <div class="p-3 bg-gray-800 rounded-full border border-gray-700">
        <i data-lucide="shield-check" class="w-8 h-8 text-yellow-500"></i>
      </div>
    </div>

    <h2 class="font-display text-2xl font-bold text-white text-center mb-6">
      Login
    </h2>

    {% if messages %}
      {% for message in messages %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/20 text-red-400 text-sm">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <!-- Username -->
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">
          Username
        </label>
        <input type="text"
               name="username"
               required
               class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 placeholder-gray-500"
               placeholder="Enter your username">
      </div>

      <!-- Password -->
      <div class="mb-6 relative">
        <label class="block text-sm text-gray-400 mb-1">
          Password
        </label>

        <input type="password"
               name="password"
               id="password"
               required
               class="w-full px-4 py-2 pr-12 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 placeholder-gray-500"
               placeholder="Enter your password">

        <!-- Eye Button -->
        <button type="button"
                onclick="togglePassword()"
                class="absolute right-3 top-9 text-gray-400 hover:text-white transition-colors"
                id="eye-button">
          <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
        </button>
      </div>

      <button type="submit"
              class="w-full py-2 bg-yellow-500 hover:bg-yellow-400 text-black font-semibold rounded-xl transition">
        Sign In
      </button>

    </form>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    function togglePassword() {
      const passwordField = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-icon");
      
      if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeIcon.setAttribute("data-lucide", "eye-off");
      } else {
        passwordField.type = "password";
        eyeIcon.setAttribute("data-lucide", "eye");
      }
      
      // Re-render the specific icon
      lucide.createIcons();
    }
  </script>

</body>
</html>
